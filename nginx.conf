server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # KORA CLI: `npm i -g https://<domain>/kora` installs the latest tarball.
  # no-cache makes npm revalidate instead of reusing a stale cached copy.
  location = /kora {
    types { }
    default_type application/gzip;
    add_header Cache-Control "no-cache" always;
    try_files /kora.tgz =404;
  }

  location = /kora.tgz {
    types { }
    default_type application/gzip;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /kora.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~ ^/kora-[0-9][0-9A-Za-z.+-]*\.tgz$ {
    types { }
    default_type application/gzip;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
